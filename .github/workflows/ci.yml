name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-kor
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang
      - name: Test
        run: dotnet test --nologo
      - name: Build app
        run: dotnet build src/DocuLensLocal.App/DocuLensLocal.App.csproj --nologo
